[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reach"
version = "0.1.0"
description = "Project-local, Windows-first channel diagnostics and update manager."
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "packaging>=23.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
]

[project.scripts]
agent-reach = "agent_reach.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
